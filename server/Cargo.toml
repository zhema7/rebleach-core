[package]
name = "rebleach-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "rebleach-server"
path = "src/main.rs"

[dependencies]
# Web framework with built-in WebSocket support
axum = { version = "0.8", features = ["ws", "tokio", "json"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
parking_lot = "0.12"
# SQLite 内嵌（server 模式，后面换成 PostgreSQL 接多租户）
rusqlite = { version = "0.32", features = ["bundled"] }
# Ed25519 设备密钥验证
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
base64 = "0.22"
# TURN 临时凭据（TURN REST: HMAC-SHA1）
hmac = "0.12"
sha1 = "0.10"
clap = { version = "4", features = ["derive"] }
# 安装包下载流式传输
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
# 集成测试：对 Router 发起 oneshot 请求
tower = { version = "0.5", features = ["util"] }
hyper = { version = "1", features = ["full"] }
http-body-util = "0.1"
