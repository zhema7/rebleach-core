[workspace]
resolver = "2"
members = [
    "server",
    "client",
    "app/src-tauri",
    "app/ui-shim",
]

[workspace.package]
version = "0.2.5"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/zhema7/rebleach-core"
rust-version = "1.80"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
