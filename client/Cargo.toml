[package]
name = "rebleach-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "rebleach-client"
path = "src/main.rs"
# Android 端 main.rs 被 cfg 掉，不需要 bin target
required-features = ["desktop"]

# T3：ProxyCommand 工具——`ssh -o ProxyCommand="rebleach-proxy --device X --stdio %h %p"`
[[bin]]
name = "rebleach-proxy"
path = "src/bin/proxy.rs"
required-features = ["desktop"]

[lib]
name = "rebleach_client"
path = "src/lib.rs"
# Android 上作为 JNI .so 被 Kotlin 加载（cargo-ndk 构建时生效）
crate-type = ["lib", "cdylib"]

[features]
default = ["desktop"]
# 桌面端：Windows 专属依赖（采集/编码/注入/音频/窗口）
desktop = ["dep:enigo", "dep:winit", "dep:softbuffer", "dep:windows", "dep:openh264", "dep:cpal", "dep:clap"]
# Android 端：纯 Rust 核心 + JNI 桥，平台能力（MediaProjection/MediaCodec/无障碍）由 Kotlin 提供
android = ["dep:jni"]

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
# 信令走 wss://，内置 pin 服务端自签 CA
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
futures-util = "0.3"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
parking_lot = "0.12"
base64 = "0.22"

# === TOFU 身份校验（ed25519 设备密钥 + SDP 签名） ===
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"

# === T3：内置最小 SSH 服务端（仅 Windows 桌面构建使用） ===
russh = "0.45"
# russh Handler trait 是 #[async_trait]，impl 侧需要同名属性宏
async-trait = "0.1"

# === T2：inventory 查询信令服务器设备列表（阻塞 HTTP，放 blocking 线程） ===
# json 特性启用 into_json 反序列化
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

# === JNI（Android 端：jni-rs 提供 JNIEnv 和 JByteArray 等安全包装）===
jni = { version = "0.21", default-features = false, optional = true }

# === 核心：WebRTC ===
# webrtc-rs 0.11 纯 Rust 实现（不含 libwebrtc C++），交叉编译 Android 无需 NDK 编 C++
webrtc = "0.11"

# === 桌面端专属依赖（feature-gate 掉，Android 端不编译） ===
enigo = { version = "0.6", optional = true }
winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }
openh264 = { version = "0.8", optional = true }
cpal = { version = "0.15", optional = true }
clap = { version = "4", features = ["derive", "env"], optional = true }
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_Environment",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_LibraryLoader",
    "Win32_System_StationsAndDesktops",
    "Win32_System_RemoteDesktop",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Foundation",
] }
